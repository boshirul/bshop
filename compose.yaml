services:
  postgres:
    image: postgres:18-alpine
    container_name: khanshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: khanshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - khanshop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khanshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  khanshop-postgres-data:
