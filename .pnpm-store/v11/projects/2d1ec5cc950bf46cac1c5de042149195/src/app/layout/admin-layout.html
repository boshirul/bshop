<mat-toolbar class="app-toolbar">
  <button matButton type="button" (click)="drawer.toggle()" aria-label="Toggle navigation">
    Menu
  </button>
  <a class="brand" routerLink="/dashboard">KhanShop</a>
  <span class="toolbar-spacer"></span>
  <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
  <button matButton type="button" (click)="logout()">Sign out</button>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav #drawer class="app-sidenav" mode="side" opened>
    <mat-nav-list aria-label="Main navigation">
      @for (item of navigation; track item.route) {
        @if (canShow(item)) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active-link"
          >
            {{ item.label }}
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
